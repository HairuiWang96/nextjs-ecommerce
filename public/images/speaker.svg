<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FDF2F8" rx="12"/>
  <g transform="translate(130, 80)">
    <!-- Speaker body (cylinder) -->
    <rect x="10" y="40" width="120" height="160" rx="30" fill="#DB2777"/>
    <ellipse cx="70" cy="40" rx="60" ry="18" fill="#EC4899"/>
    <ellipse cx="70" cy="200" rx="60" ry="18" fill="#BE185D"/>
    <!-- Speaker grille lines -->
    <line x1="22" y1="70" x2="118" y2="70" stroke="#F9A8D4" stroke-width="1.5" opacity="0.5"/>
    <line x1="18" y1="85" x2="122" y2="85" stroke="#F9A8D4" stroke-width="1.5" opacity="0.5"/>
    <line x1="16" y1="100" x2="124" y2="100" stroke="#F9A8D4" stroke-width="1.5" opacity="0.5"/>
    <line x1="16" y1="115" x2="124" y2="115" stroke="#F9A8D4" stroke-width="1.5" opacity="0.5"/>
    <line x1="16" y1="130" x2="124" y2="130" stroke="#F9A8D4" stroke-width="1.5" opacity="0.5"/>
    <line x1="18" y1="145" x2="122" y2="145" stroke="#F9A8D4" stroke-width="1.5" opacity="0.5"/>
    <line x1="22" y1="160" x2="118" y2="160" stroke="#F9A8D4" stroke-width="1.5" opacity="0.5"/>
    <!-- Power button -->
    <circle cx="70" cy="180" r="8" fill="#BE185D"/>
    <circle cx="70" cy="180" r="4" fill="#F9A8D4"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui" font-size="16" fill="#DB2777" font-weight="600">Bluetooth Speaker</text>
</svg>
