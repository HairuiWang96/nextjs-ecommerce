<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FEF3C7" rx="12"/>
  <g transform="translate(110, 100)">
    <!-- Wallet body -->
    <rect x="0" y="20" width="180" height="120" rx="10" fill="#92400E"/>
    <rect x="0" y="20" width="180" height="60" rx="10" fill="#B45309"/>
    <!-- Fold line -->
    <line x1="8" y1="80" x2="172" y2="80" stroke="#78350F" stroke-width="2"/>
    <!-- Card slot -->
    <rect x="100" y="32" width="64" height="40" rx="6" fill="#FDE68A"/>
    <rect x="108" y="40" width="20" height="6" rx="2" fill="#D97706"/>
    <!-- Snap button -->
    <circle cx="170" cy="80" r="8" fill="#D97706"/>
    <circle cx="170" cy="80" r="4" fill="#FBBF24"/>
    <!-- Stitching -->
    <rect x="8" y="26" width="164" height="108" rx="8" fill="none" stroke="#78350F" stroke-width="1" stroke-dasharray="6,4"/>
  </g>
  <text x="200" y="300" text-anchor="middle" font-family="system-ui" font-size="16" fill="#92400E" font-weight="600">Leather Wallet</text>
</svg>
