<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FFF7ED" rx="12"/>
  <g transform="translate(100, 90)">
    <!-- Hub body -->
    <rect x="20" y="60" width="160" height="100" rx="20" fill="#F97316"/>
    <!-- Top surface -->
    <ellipse cx="100" cy="60" rx="80" ry="15" fill="#FB923C"/>
    <!-- LED ring -->
    <ellipse cx="100" cy="60" rx="40" ry="8" fill="none" stroke="#FED7AA" stroke-width="3"/>
    <!-- Center dot (active) -->
    <circle cx="100" cy="60" r="6" fill="#FEF3C7">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Connection dots -->
    <circle cx="50" cy="110" r="5" fill="#FED7AA"/>
    <circle cx="80" cy="110" r="5" fill="#FED7AA"/>
    <circle cx="110" cy="110" r="5" fill="#FED7AA"/>
    <circle cx="140" cy="110" r="5" fill="#FED7AA"/>
    <!-- Signal waves -->
    <path d="M60,30 Q100,10 140,30" fill="none" stroke="#FDBA74" stroke-width="2" opacity="0.6"/>
    <path d="M50,18 Q100,0 150,18" fill="none" stroke="#FDBA74" stroke-width="2" opacity="0.3"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui" font-size="16" fill="#EA580C" font-weight="600">Smart Home Hub</text>
</svg>
