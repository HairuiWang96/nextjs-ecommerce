<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#FDF2F8" rx="12"/>
  <g transform="translate(60, 110)">
    <!-- Sole -->
    <path d="M30,150 Q10,150 10,140 L10,130 Q60,120 280,130 L280,140 Q280,155 260,155 L50,155 Q30,155 30,150 Z" fill="#BE185D"/>
    <!-- Shoe body -->
    <path d="M30,130 Q20,50 80,40 L150,35 Q200,30 240,60 Q270,80 280,130 Z" fill="#EC4899"/>
    <!-- Tongue -->
    <path d="M80,40 Q90,10 120,5 Q140,15 150,35" fill="#F472B6"/>
    <!-- Swoosh/stripe -->
    <path d="M60,100 Q120,70 250,90" fill="none" stroke="#FFF" stroke-width="5" stroke-linecap="round"/>
    <!-- Lace holes -->
    <circle cx="95" cy="45" r="3" fill="#FFF"/>
    <circle cx="110" cy="40" r="3" fill="#FFF"/>
    <circle cx="125" cy="38" r="3" fill="#FFF"/>
    <!-- Laces -->
    <line x1="95" y1="45" x2="110" y2="40" stroke="#FFF" stroke-width="1.5"/>
    <line x1="110" y1="40" x2="125" y2="38" stroke="#FFF" stroke-width="1.5"/>
    <!-- Sole texture -->
    <line x1="40" y1="145" x2="60" y2="145" stroke="#9D174D" stroke-width="2"/>
    <line x1="80" y1="145" x2="100" y2="145" stroke="#9D174D" stroke-width="2"/>
    <line x1="120" y1="145" x2="140" y2="145" stroke="#9D174D" stroke-width="2"/>
    <line x1="160" y1="145" x2="180" y2="145" stroke="#9D174D" stroke-width="2"/>
    <line x1="200" y1="145" x2="220" y2="145" stroke="#9D174D" stroke-width="2"/>
    <line x1="240" y1="145" x2="260" y2="145" stroke="#9D174D" stroke-width="2"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui" font-size="16" fill="#DB2777" font-weight="600">Running Shoes</text>
</svg>
