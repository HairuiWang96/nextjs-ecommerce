<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#ECFDF5" rx="12"/>
  <g transform="translate(150, 60)">
    <!-- Cap -->
    <rect x="25" y="0" width="50" height="30" rx="6" fill="#059669"/>
    <!-- Neck -->
    <rect x="32" y="30" width="36" height="40" rx="4" fill="#10B981"/>
    <!-- Body -->
    <rect x="10" y="70" width="80" height="200" rx="16" fill="#10B981"/>
    <!-- Shine -->
    <rect x="22" y="85" width="16" height="160" rx="8" fill="#6EE7B7" opacity="0.6"/>
    <!-- Band -->
    <rect x="10" y="130" width="80" height="8" rx="4" fill="#059669"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui" font-size="16" fill="#059669" font-weight="600">Water Bottle</text>
</svg>
