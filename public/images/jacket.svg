<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#EFF6FF" rx="12"/>
  <g transform="translate(110, 60)">
    <!-- Left sleeve -->
    <path d="M30,60 L0,140 L30,150 L50,80 Z" fill="#2563EB"/>
    <!-- Right sleeve -->
    <path d="M150,60 L180,140 L150,150 L130,80 Z" fill="#2563EB"/>
    <!-- Body -->
    <path d="M30,40 Q50,20 90,20 Q130,20 150,40 L150,220 L30,220 Z" fill="#3B82F6"/>
    <!-- Collar -->
    <path d="M50,40 Q90,55 130,40 Q120,20 90,20 Q60,20 50,40 Z" fill="#1D4ED8"/>
    <!-- Center line (zipper/buttons) -->
    <line x1="90" y1="55" x2="90" y2="220" stroke="#1D4ED8" stroke-width="2"/>
    <!-- Buttons -->
    <circle cx="90" cy="80" r="4" fill="#1D4ED8"/>
    <circle cx="90" cy="110" r="4" fill="#1D4ED8"/>
    <circle cx="90" cy="140" r="4" fill="#1D4ED8"/>
    <circle cx="90" cy="170" r="4" fill="#1D4ED8"/>
    <!-- Pockets -->
    <rect x="42" y="130" width="38" height="30" rx="4" fill="none" stroke="#1D4ED8" stroke-width="2"/>
    <rect x="100" y="130" width="38" height="30" rx="4" fill="none" stroke="#1D4ED8" stroke-width="2"/>
  </g>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui" font-size="16" fill="#2563EB" font-weight="600">Denim Jacket</text>
</svg>
